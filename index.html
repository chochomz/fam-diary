    <title>우리 가족 이야기</title>
    <!-- [외부 리소스 연결] -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- [상·하단 바 순백색 고정] -->
    <meta name="theme-color" content="#FFFFFF">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#FFFFFF">

    <style>
        html, body {
            width: 100%; height: 100%; max-width: 100vw; overflow: hidden;
            font-family: 'Pretendard', sans-serif; 
            background-color: #FFFFFF !important; 
            color: #222222;
            -webkit-tap-highlight-color: transparent; 
            touch-action: manipulation;
            -webkit-text-size-adjust: 100% !important;
            overscroll-behavior-y: none;
            margin: 0; padding: 0;
        }

        /* [상·하단 바 흰색 고정 엣지] */
        #safari-top-edge {
            position: fixed; top: 0; left: 0; right: 0;
            height: env(safe-area-inset-top, 0px);
            background-color: #FFFFFF !important;
            z-index: 10000;
            pointer-events: none;
        }
        #safari-bottom-edge {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: env(safe-area-inset-bottom, 0px);
            background-color: #FFFFFF !important;
            z-index: 10000;
            pointer-events: none;
        }

        /* [슬라이드 전환 애니메이션] */
        @keyframes slideUpGate {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100%); opacity: 0.95; }
        }

        .gate-exit-active {
            animation: slideUpGate 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
        }

        #auth-gate {
            position: fixed; inset: 0; z-index: 995;
            background-color: #FFFFFF;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; touch-action: manipulation;
            will-change: transform, opacity;
            margin: 0; padding: 0;
        }

        #monthly-svg-stage {
            position: relative;
            width: 100vw;
            height: 100dvh;
            margin: 0; 
            padding-top: max(env(safe-area-inset-top, 0px), 10px);
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 90px);
            display: flex; align-items: center; justify-content: center;
            pointer-events: none; user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background-color: #FFFFFF;
            box-sizing: border-box;
            transform: translateY(-16px);
        }

        #monthly-svg-stage svg.full-bleed-svg {
            width: 100%; height: 100%;
            max-height: calc(100dvh - 110px);
            display: block; pointer-events: none; user-select: none;
        }

        /* [하단 3회 터치 시 페이드인되는 플로팅 바 & 두꺼운 빨간색 사각형 커서] */
        #code-auth-box {
            position: absolute;
            left: 50%;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
            transform: translateX(-50%);
            z-index: 45;
            opacity: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 9999px;
            padding: 8px 18px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            user-select: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* 하단 3회 터치 감지 영역 (화면 하단 35%) */
        #bottom-tap-trigger-zone {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 38vh;
            z-index: 30;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .auth-label {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.04em;
            margin-right: 4px;
            color: #FFFFFF;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
        }

        .auth-underline-input {
            background: transparent !important;
            text-align: center;
            font-size: 15px !important;
            font-weight: 700;
            color: #FFFFFF !important;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
            border-radius: 0 !important;
            border: none !important;
            border-bottom: 2px solid rgba(255, 255, 255, 0.85) !important;
            outline: none !important;
            padding: 1px 2px 2px 2px;
            caret-color: #EF4444 !important;
            caret-shape: block !important;
            letter-spacing: 0.12em;
            transition: border-color 0.2s, opacity 0.2s;
        }

        #input-family-code { width: 54px; }
        #input-member-name { width: 76px; }

        @keyframes blockCaretBlink {
            0%, 49% { border-right: 7px solid #EF4444; }
            50%, 100% { border-right: 7px solid transparent; }
        }
        .input-block-cursor:focus {
            animation: blockCaretBlink 0.9s infinite;
        }

        #input-member-name:disabled {
            opacity: 0.38;
            cursor: not-allowed;
            border-bottom-color: rgba(255, 255, 255, 0.3) !important;
        }

        .auth-auto-check {
            width: 15px;
            height: 15px;
            cursor: pointer;
            accent-color: #3B5D50;
            vertical-align: middle;
        }

        @keyframes floatHeart {
            0% { transform: translateY(0) scale(0.6); opacity: 0; }
            25% { opacity: 0.7; } 
            75% { opacity: 0.4; } 
            100% { transform: translateY(-115vh) scale(1.4); opacity: 0; }
        }
        .floating-heart {
            position: fixed; bottom: -50px; color: #ff7799; 
            filter: drop-shadow(0 2px 6px rgba(255, 255, 255, 0.8));
            pointer-events: none; z-index: 1000; opacity: 0;
        }
    </style>
</head>
<body class="flex flex-col h-full w-full max-w-full overflow-hidden bg-[#FFFFFF]">

    <div id="safari-top-edge"></div>
    <div id="safari-bottom-edge"></div>

    <div id="auth-gate">
        <div id="monthly-svg-stage"></div>

        <div id="admin-secret-zone" class="absolute top-0 right-0 w-20 h-20 z-40">
            <button type="button" onclick="goToAdminPage(event)" aria-label="관리자 페이지" class="w-full h-full bg-transparent border-0 focus:outline-none"></button>
        </div>

        <div id="bottom-tap-trigger-zone" onclick="handleBottomThreeTap(event)" onpointerdown="event.stopPropagation();"></div>

        <div id="code-auth-box" onpointerdown="event.stopPropagation();">
            <div class="flex items-center space-x-2">
                <div class="flex items-center">
                    <span class="auth-label">Code</span>
                    <input type="text" id="input-family-code" oninput="handleCodeInput(this)" maxlength="4" inputmode="numeric" pattern="[0-9]*" class="auth-underline-input input-block-cursor">
                </div>

                <div class="w-2"></div>

                <div class="flex items-center">
                    <span class="auth-label">ID</span>
                    <input type="text" id="input-member-name" oninput="handleNameInput(this)" onfocus="guardNameInputFocus(this)" maxlength="6" disabled readonly tabindex="-1" class="auth-underline-input input-block-cursor">
                </div>

                <label class="flex items-center ml-2 space-x-1 cursor-pointer select-none" title="이름 자동저장">
                    <input type="checkbox" id="auto-login-check" onchange="handleAutoCheckChange(this)" class="auth-auto-check">
                    <span class="text-[10.5px] font-bold text-white/90">auto</span>
                </label>
            </div>
        </div>
    </div>

        function renderDailyMonthlySvgCover() {
            if (!svgStage) return;
            const now = new Date();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const isOddDay = (day % 2 === 1);

            const d = MONTHLY_DESIGN_DATA[month] || MONTHLY_DESIGN_DATA[5];
            const activeBg = isOddDay ? d.oddOuterBg : d.evenBg;

            svgStage.style.backgroundColor = activeBg;

            if (isOddDay) {
                svgStage.innerHTML = `
                    <svg class="full-bleed-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 270" preserveAspectRatio="xMidYMid meet" role="img">

                        <path d="M25 167 V99 A75 75 0 0 1 175 99 V167Z" fill="${d.oddArchBg}"/>

                        <circle cx="100" cy="176" r="19" fill="${d.oddStroke}" stroke="${d.oddOuterBg}" stroke-width="3"/>
                        <line x1="84" y1="231" x2="116" y2="231" stroke="${d.oddStroke}" stroke-width="1.5"/>
                        <g font-family="'Noto Serif KR','Nanum Myeongjo','Apple SD Gothic Neo',serif" text-anchor="middle">
                            <text x="100" y="180" font-size="12" font-weight="700" fill="#2B2B2B">${month}월</text>
                            <text x="100" y="222" font-size="20" font-weight="700" fill="${d.oddText}">${d.title}</text>
                            <text x="100" y="249" font-size="11" fill="${d.oddText}" opacity="0.88">${d.sub}</text>
                        </g>
                    </svg>
                `;
            } else {
                svgStage.innerHTML = `
                    <svg class="full-bleed-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 270" preserveAspectRatio="xMidYMid slice" role="img">
                        <title>${month}월 · ${d.title}</title>
                        <rect x="-500" y="-500" width="1200" height="1270" fill="${d.evenBg}"/>
                        ${d.art}
                        <g font-family="'Noto Serif KR','Nanum Myeongjo','Apple SD Gothic Neo',serif" text-anchor="middle" fill="${d.evenText}">
                            <text x="100" y="26" font-size="11" opacity="0.75">${month}월</text>
                            <text x="100" y="52" font-size="20" font-weight="700">${d.title}</text>

        renderDailyMonthlySvgCover();
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && !isLoginTransitioning) renderDailyMonthlySvgCover();
        });

        let isCodePassed = false;
        let isLoginTransitioning = false;

        let bottomTapCount = 0;
        let bottomTapTimer = null;
        let lastBottomTapTime = 0;

        window.handleBottomThreeTap = function(e) {
            if (isLoginTransitioning) return;
            if (e && e.target && e.target.closest('#code-auth-box')) return;

            const now = Date.now();
            if (now - lastBottomTapTime < 180) return;
            lastBottomTapTime = now;

            bottomTapCount++;
            if (bottomTapCount >= 3) {
                bottomTapCount = 0;
                clearTimeout(bottomTapTimer);

                const authBox = document.getElementById('code-auth-box');
                const codeInput = document.getElementById('input-family-code');

                if (authBox) {
                    authBox.style.opacity = '1';
                    authBox.style.pointerEvents = 'auto';
                }

                if (navigator.vibrate) {
                    try { navigator.vibrate([30, 40, 30]); } catch(err) {}
                }

                if (codeInput) {
                    setTimeout(() => {
                        try { codeInput.focus(); } catch(err) {}
                    }, 120);
                }
            } else {
                clearTimeout(bottomTapTimer);
                bottomTapTimer = setTimeout(() => {
                    bottomTapCount = 0;
                }, 900);
            }
        };

        function getStoredAutoName() {
            try {
                const isAuto = localStorage.getItem('family_auto_remember') === 'true';
                if (!isAuto) return '';
                const saved = localStorage.getItem('family_user_name');
                return (saved && saved.trim()) ? saved.trim() : '';
            } catch(e) { return ''; }
        }

        function initAutoCheckUI() {
            const chk = document.getElementById('auto-login-check');
            if (chk) {
                chk.checked = (localStorage.getItem('family_auto_remember') === 'true');
            }
        }
        setTimeout(initAutoCheckUI, 100);

        window.handleAutoCheckChange = function(el) {
            try {
                if (el.checked) {
                    localStorage.setItem('family_auto_remember', 'true');
                } else {
                    localStorage.setItem('family_auto_remember', 'false');
                }
            } catch(e) {}
        };

        window.guardNameInputFocus = function(nameInput) {
            if (!isCodePassed) {
                nameInput.blur();
                const codeInput = document.getElementById('input-family-code');
                if (codeInput) codeInput.focus();
            }
        };

        function setNameInputLocked(locked) {
            const nameInput = document.getElementById('input-member-name');
            if (!nameInput) return;
            if (locked) {
                isCodePassed = false;
                nameInput.value = '';
                nameInput.disabled = true;
                nameInput.readOnly = true;
                nameInput.setAttribute('tabindex', '-1');
            } else {
                isCodePassed = true;
                nameInput.disabled = false;
                nameInput.readOnly = false;
                nameInput.removeAttribute('tabindex');
            }
        }

        window.handleCodeInput = function(input) {
            let clean = input.value.replace(/[^0-9]/g, '').slice(0, 4);
            if (input.value !== clean) input.value = clean;
            
            let validCode = window.liveFamilyConfig?.familyCode || window.liveFamilyConfig?.mokjangCode || '1111';
            try {
                const rawCfg = localStorage.getItem('family_config_backup');
                if (rawCfg && !window.liveFamilyConfigLoaded) {
                    const cfg = JSON.parse(rawCfg);
                    if (cfg.familyCode || cfg.mokjangCode) {
                        validCode = String(cfg.familyCode || cfg.mokjangCode).trim();
                    }
                }
            } catch(e) {}

            const isCodeCorrect = (clean.length === 4 && (clean === '1111' || clean === validCode));

            if (isCodeCorrect) {
                setNameInputLocked(false);
                const storedName = getStoredAutoName();
                if (storedName) {
                    const nameInput = document.getElementById('input-member-name');
                    if (nameInput) nameInput.value = storedName;
                    checkAutoLogin();
                    return;
                }

                if (document.activeElement === input) {
                    if (navigator.vibrate) {
                        try { navigator.vibrate(40); } catch(e) {}
                    }
                    const nameInput = document.getElementById('input-member-name');
                    if (nameInput) nameInput.focus();
                }
            } else {
                setNameInputLocked(true);
            }
            checkAutoLogin();
        };

        window.handleNameInput = function(input) {
            if (!isCodePassed) {
                setNameInputLocked(true);
                const codeInput = document.getElementById('input-family-code');
                if (codeInput) codeInput.focus();
                return;
            }
            let clean = input.value.replace(/[^ㄱ-ㅎㅏ-ㅣ가-힣0-9a-zA-Z]/g, '').slice(0, 6);
            if (input.value !== clean) input.value = clean;
            checkAutoLogin();
        };

        function checkAutoLogin() {
            if (!isCodePassed || isLoginTransitioning) return;
            const codeInput = document.getElementById('input-family-code');
            const nameInput = document.getElementById('input-member-name');
            const code = codeInput.value.trim();
            const name = nameInput.value.trim();

            let cfg = window.liveFamilyConfig || {};
            try {
                const rawCfg = localStorage.getItem('family_config_backup');
                if (rawCfg && !window.liveFamilyConfigLoaded) {
                    cfg = JSON.parse(rawCfg) || {};
                }
            } catch(e) {}

            const validCode = (cfg.familyCode || cfg.mokjangCode) ? String(cfg.familyCode || cfg.mokjangCode).trim() : '1111';
            const rawFamilyTitle = cfg.familyName || cfg.mokjangName || '';
            const familyShort = rawFamilyTitle ? String(rawFamilyTitle).trim().replace(/^우리\s*가족\s*이야기\s*/, '') : '';
            const leaderName = (cfg.adminFatherName || cfg.leaderName) ? String(cfg.adminFatherName || cfg.leaderName).trim() : '아빠';
            const subLeaderName = (cfg.adminMotherName || cfg.subLeaderName || cfg.subleaderName) ? String(cfg.adminMotherName || cfg.subLeaderName || cfg.subleaderName).trim() : '';
            const subLeaders = Array.isArray(cfg.subLeaders) ? cfg.subLeaders : [];
            const validMembers = Array.isArray(cfg.members) ? cfg.members.map(m => typeof m === 'object' ? m.name : m) : ['1111'];
            const memberRoles = (cfg.memberRoles && typeof cfg.memberRoles === 'object') ? cfg.memberRoles : {};

            const isDefaultMatch = (code === '1111' && name === '1111');
            const isLeaderMatch = (code === validCode && (name === leaderName || memberRoles[name] === 'leader'));
            const isSubLeaderMatch = (code === validCode && ((subLeaderName && name === subLeaderName) || subLeaders.includes(name) || memberRoles[name] === 'subleader'));
            const isMemberMatch = (code === validCode && validMembers.includes(name));

            if (code.length === 4 && name.length >= 2 && (isDefaultMatch || isLeaderMatch || isSubLeaderMatch || isMemberMatch)) {
                let userRole = 'member';
                let isAdminBool = false;

                if (isLeaderMatch || name === leaderName || name === '아빠' || name === '관리자') {
                    userRole = 'leader';
                    isAdminBool = true;
                } else if (isSubLeaderMatch || name === '엄마') {
                    userRole = 'subleader';
                    isAdminBool = true;
                }

                const isAdminFlag = isAdminBool ? '1' : '0';

                try {
                    localStorage.setItem('family_user_name', name);
                    localStorage.setItem('family_user_role', userRole);
                    localStorage.setItem('family_short_name', familyShort);
                    localStorage.setItem('family_name', familyShort || '우리 가족 이야기');
                    localStorage.setItem('family_is_admin', isAdminBool ? 'true' : 'false');
                } catch(e) {}

                codeInput.blur();
                nameInput.blur();
                handleMemberLogin(name, familyShort, isAdminFlag, userRole);
            }
        }

        function handleMemberLogin(userName, familyShort = '', isAdminFlag = '0', userRole = 'member') {
            if (isLoginTransitioning) return;
            isLoginTransitioning = true;

            const finalName = userName || document.getElementById('input-member-name').value.trim() || '우리가족';
            const finalFamily = familyShort || '';

            // [핵심 해결] 1회용 통행증을 정확하게 발급하여 index2.html이 유효하게 읽도록 보장
            try {
                sessionStorage.setItem('family_entry_pass', JSON.stringify({
                    target: 'index2.html',
                    authorizedFromIndex: true,
                    token: 'tk_' + Date.now() + '_' + Math.random().toString(36).slice(2),
                    userName: finalName,
                    familyShort: finalFamily,
                    mokjangShort: finalFamily,
                    role: userRole,
                    isAdmin: isAdminFlag === '1',
                    issuedAt: Date.now()
                }));
            } catch (e) {}

            forceWhiteBar();
            createHearts();

            const autoChk = document.getElementById('auto-login-check');
            if (autoChk && autoChk.checked) {
                localStorage.setItem('family_auto_remember', 'true');
            }

            authGate.classList.add('gate-exit-active');

            // 0.35초 후 index2.html로 안전하고 부드럽게 직행
            setTimeout(() => {
                window.location.replace('index2.html');
            }, 350);
        }

        let adminTapCount = 0;
        let adminTapResetTimer = null;

        function goToAdminPage(e) {
            if (e) e.stopPropagation();
            adminTapCount++;
            if (adminTapCount >= 10) {
                adminTapCount = 0;
                clearTimeout(adminTapResetTimer);
                try {
                    sessionStorage.setItem('family_entry_pass', JSON.stringify({
                        target: 'index1.html',
                        authorizedFromIndex: true,
                        token: 'tk_' + Date.now() + '_' + Math.random().toString(36).slice(2),
                        issuedAt: Date.now()
                    }));
                } catch (e) {}
                window.location.replace('index1.html');
                return;
            }
            clearTimeout(adminTapResetTimer);
            adminTapResetTimer = setTimeout(() => {
                adminTapCount = 0;
            }, 1500);
        }

        function createHearts() {
            const heartCount = 35;
            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('i');
                heart.className = 'fa-solid fa-heart floating-heart';
                const left = Math.random() * 100;
                const size = Math.random() * 16 + 12;
                const duration = Math.random() * 1.2 + 2.0;
                const delay = Math.random() * 0.4;
                heart.style.left = `${left}vw`;
                heart.style.fontSize = `${size}px`;
                heart.style.animation = `floatHeart ${duration}s ease-out ${delay}s forwards`;
                document.body.appendChild(heart);
                setTimeout(() => { heart.remove(); }, (duration + delay) * 1000 + 100);
            }
        }
    </script>
