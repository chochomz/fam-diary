<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>우리 가족 이야기</title>
    <!-- [모바일 속도 최적화: 외부 리소스 사전 연결 & DNS 프리페치] -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://firestore.googleapis.com">
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%233B5D50'/%3E%3Cpath d='M16 23s-7-4.35-7-9.5A4.25 4.25 0 0 1 16 10a4.25 4.25 0 0 1 7 3.5C23 18.65 16 23 16 23z' fill='%23ffffff'/%3E%3C/svg%3E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#3B5D50">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard-dynamic-subset.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            width: 100%; height: 100%; max-width: 100vw; overflow: hidden;
            font-family: 'Pretendard', sans-serif; background-color: #F8F9FA; color: #222222;
            -webkit-tap-highlight-color: transparent; touch-action: manipulation;
            -webkit-text-size-adjust: 100% !important;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* [게이트와 index2 스테이지가 한 몸처럼 맞닿아 함께 올라가는 일체형 심리스 모션] */
        @keyframes dipAndSlideUpSeamless {
            0% { transform: translateY(0%); }
            22% { transform: translateY(32px); }
            100% { transform: translateY(-100%); }
        }
        @keyframes dipAndFollowUpStage {
            0% { transform: translateY(100%); }
            22% { transform: translateY(calc(100% + 32px)); }
            100% { transform: translateY(0%); }
        }

        .gate-open-active {
            animation: dipAndSlideUpSeamless 3.0s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .stage-follow-active {
            animation: dipAndFollowUpStage 3.0s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* 게이트 바로 아래에서 뒤따라 올라오는 실제 index2.html 무리프레시 스테이지 */
        #seamless-index2-stage {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 990;
            background-color: #F8F9FA;
            transform: translateY(100%);
            will-change: transform;
            overflow: hidden;
        }
        #seamless-index2-frame {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background-color: #F8F9FA;
        }

        #auth-gate {
            position: fixed; inset: 0; z-index: 999;
            background-color: #ffffff;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; touch-action: manipulation;
            will-change: transform;
            cursor: pointer;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
        }

        .gate-img-layer {
            position: absolute; inset: 0;
            background-image: url('img_1042.png'), url('IMG_1042.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #gate-top { clip-path: inset(0 0 50% 0); }
        #gate-bottom { clip-path: inset(50% 0 0 0); cursor: pointer; }

        /* 갈라진 사이에 나타나는 둥근 캡슐형 로그인 창 및 회색 깜빡이는 커서 */
        #code-auth-box {
            position: absolute; left: 50%; top: 70%;
            transform: translate(-50%, -50%);
            z-index: 30; opacity: 0; pointer-events: none;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.3s ease;
            background-color: #ffffff;
            border: 1px dashed #9ca3af;
            border-radius: 9999px;
            padding: 6px 12px;
        }

        #code-auth-box input {
            font-size: 16px !important;
            -webkit-text-size-adjust: 100% !important;
            caret-color: #6b7280 !important;
        }

        /* 코드 Pass 전 이름 입력창 잠금 스타일 */
        #input-member-name:disabled {
            opacity: 0.38;
            cursor: not-allowed;
        }

        #floating-words-layer {
            position: absolute; inset: 0; z-index: 20;
            pointer-events: none; overflow: hidden;
            transition: opacity 0.6s ease;
        }
        .floating-grace-word {
            position: absolute; left: 50%; top: 72%;
            transform: translate(-50%, -50%) scale(0);
            font-family: 'Song Myung', serif;
            color: #c29ba1;
            font-size: clamp(19px, 5.2vw, 24px);
            font-weight: 400;
            letter-spacing: 0.06em;
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
            opacity: 0;
            text-shadow: 0 1px 6px rgba(255, 255, 255, 0.9);
            will-change: transform, left, top, opacity;
        }

        @keyframes floatHeart {
            0% { transform: translateY(0) scale(0.6); opacity: 0; }
            25% { opacity: 0.7; } 
            75% { opacity: 0.4; } 
            100% { transform: translateY(-115vh) scale(1.4); opacity: 0; }
        }
        .floating-heart {
            position: fixed; bottom: -50px; color: #ff7799; 
            filter: drop-shadow(0 2px 6px rgba(255, 255, 255, 0.8));
            pointer-events: none; z-index: 1000; opacity: 0;
        }
    </style>
</head>
<body class="flex flex-col h-full w-full max-w-full overflow-hidden bg-[#F8F9FA]">

    <!-- [게이트 바로 뒤를 따라 올라오는 실제 index2.html 스테이지 (리프레시 끊김 0%)] -->
    <div id="seamless-index2-stage">
        <iframe id="seamless-index2-frame" title="우리 가족 이야기 피드"></iframe>
    </div>

    <!-- [제스처 인증 게이트 (추후 별도 SVG 표지 적용 영역)] -->
    <div id="auth-gate">
        <div class="gate-img-layer" id="gate-top"></div>
        <div class="gate-img-layer" id="gate-bottom"></div>

        <!-- 우측 상단 10회 터치 시 관리자(index1.html) 진입 -->
        <div id="admin-secret-zone" class="absolute top-0 right-0 w-20 h-20 z-40">
            <button type="button" onclick="goToAdminPage(event)" aria-label="관리자 페이지" class="w-full h-full bg-transparent border-0 focus:outline-none"></button>
        </div>

        <div id="floating-words-layer"></div>

        <!-- 갈라진 사이에 나타나는 둥근 캡슐형 로그인 창 -->
        <div id="code-auth-box" onclick="handleAuthBoxClick(event)" onpointerdown="event.stopPropagation();">
            <!-- 코드는 숫자 최대 4자리 -->
            <input type="text" id="input-mokjang-code" oninput="handleCodeInput(this)" placeholder="코드" maxlength="4" inputmode="numeric" pattern="[0-9]*" class="w-[55px] bg-transparent text-center text-gray-900 focus:outline-none font-bold">
            <div class="w-px h-3.5 bg-gray-400 mx-1"></div>
            <!-- 이름은 코드가 Pass되어야만 활성화됨 (초기 잠금 상태) -->
            <input type="text" id="input-member-name" oninput="handleNameInput(this)" onfocus="guardNameInputFocus(this)" placeholder="이름" maxlength="4" disabled readonly tabindex="-1" class="w-[55px] bg-transparent text-center text-gray-900 focus:outline-none font-bold transition-opacity duration-200">
        </div>
    </div>

    <script>
        // 주소창을 깔끔하게 유지 (index.html 노출 제거)
        try {
            if (window.history && typeof window.history.replaceState === 'function') {
                const cleanBase = window.location.pathname.replace(/\/?index\.html.*$/i, '/');
                window.history.replaceState(null, document.title, cleanBase || '/');
            }
            sessionStorage.removeItem('family_entry_pass');
            sessionStorage.removeItem('family_authorized_session');
        } catch (e) {}

        const authGate = document.getElementById('auth-gate');
        const gateBottom = document.getElementById('gate-bottom');
        const codeAuthBox = document.getElementById('code-auth-box');
        const floatingWordsLayer = document.getElementById('floating-words-layer');
        const seamlessStage = document.getElementById('seamless-index2-stage');
        const seamlessFrame = document.getElementById('seamless-index2-frame');

        const GRACE_WORDS = ['사랑', '행복', '건강', '감사', '웃음', '추억', '소망', '화목', '기쁨', '동행'];
        const floatingWordItems = [];
        let floatingAnimId = null;
        let isFloatingWordsActive = true;
        let isCodePassed = false;
        let isLoginTransitioning = false;

        function initFloatingWords() {
            if (!floatingWordsLayer) return;
            floatingWordsLayer.innerHTML = '';
            floatingWordItems.length = 0;
            let animBaseTime = null;

            // 10개 단어가 서로 겹치지 않도록 지그재그(4개 - 3개 - 3개) 슬롯으로 넓게 분산 배치
            const staggeredSlots = [
                { x: 23, y: 59.8 }, { x: 41, y: 59.2 }, { x: 59, y: 59.8 }, { x: 77, y: 59.4 },
                { x: 30, y: 65.5 }, { x: 50, y: 65.0 }, { x: 70, y: 65.5 },
                { x: 26, y: 71.2 }, { x: 50, y: 71.8 }, { x: 74, y: 71.2 }
            ];

            GRACE_WORDS.forEach((word, idx) => {
                const el = document.createElement('span');
                el.className = 'floating-grace-word';
                el.textContent = word;
                floatingWordsLayer.appendChild(el);

                const slot = staggeredSlots[idx] || { x: 50, y: 65 };
                const targetX = Math.max(21, Math.min(79, slot.x + (Math.random() * 4 - 2)));
                const targetY = Math.max(58.5, Math.min(73.0, slot.y + (Math.random() * 1.6 - 0.8)));

                floatingWordItems.push({
                    el,
                    spawnDelay: idx * 520,
                    spawnDuration: 2200,
                    x: targetX,
                    y: targetY,
                    vx: (Math.random() * 0.015 + 0.007) * (idx % 2 === 0 ? 1 : -1),
                    vy: (Math.random() * 0.011 + 0.005) * (idx % 3 === 0 ? 1 : -1),
                    scaleSpeed: 0.0014 + Math.random() * 0.0006,
                    swaySpeed: 0.0011 + Math.random() * 0.0005,
                    swayDir: idx % 2 === 0 ? 1 : -1
                });
            });

            function animateWords(timestamp) {
                if (!isFloatingWordsActive) return;
                if (animBaseTime === null) animBaseTime = timestamp;

                const totalElapsed = timestamp - animBaseTime;

                // 유영 중인 단어들끼리 너무 가까워지면 서로 부드럽게 밀어내어 겹침을 50% 감소시킴
                for (let i = 0; i < floatingWordItems.length; i++) {
                    const a = floatingWordItems[i];
                    if (totalElapsed - a.spawnDelay < a.spawnDuration) continue;
                    for (let j = i + 1; j < floatingWordItems.length; j++) {
                        const b = floatingWordItems[j];
                        if (totalElapsed - b.spawnDelay < b.spawnDuration) continue;

                        const dx = a.x - b.x;
                        const dy = (a.y - b.y) * 2.4;
                        const distSq = dx * dx + dy * dy;
                        const minDist = 14.5;

                        if (distSq > 0.01 && distSq < minDist * minDist) {
                            const dist = Math.sqrt(distSq);
                            const push = (minDist - dist) * 0.0018;
                            const nx = dx / dist;
                            const ny = (a.y - b.y) / dist;
                            a.vx += nx * push;
                            a.vy += ny * push * 0.45;
                            b.vx -= nx * push;
                            b.vy -= ny * push * 0.45;

                            const maxVx = 0.024, maxVy = 0.016;
                            a.vx = Math.max(-maxVx, Math.min(maxVx, a.vx));
                            a.vy = Math.max(-maxVy, Math.min(maxVy, a.vy));
                            b.vx = Math.max(-maxVx, Math.min(maxVx, b.vx));
                            b.vy = Math.max(-maxVy, Math.min(maxVy, b.vy));
                        }
                    }
                }

                floatingWordItems.forEach((item) => {
                    const elapsed = totalElapsed - item.spawnDelay;
                    if (elapsed < 0) return;

                    if (elapsed < item.spawnDuration) {
                        const p = Math.min(1, Math.max(0, elapsed / item.spawnDuration));
                        const easeOut = 1 - Math.pow(1 - p, 2.4);
                        const curX = 50 + (item.x - 50) * easeOut;
                        const curY = 72 + (item.y - 72) * easeOut;
                        const curScale = 0.2 + 0.8 * easeOut;
                        const curOpacity = Math.min(0.86, p * 0.86);

                        item.el.style.left = `${curX.toFixed(2)}%`;
                        item.el.style.top = `${curY.toFixed(2)}%`;
                        item.el.style.opacity = `${curOpacity.toFixed(2)}`;
                        item.el.style.transform = `translate(-50%, -50%) scale(${curScale.toFixed(3)}) rotate(0deg)`;
                    } else {
                        const floatTime = elapsed - item.spawnDuration;

                        item.x += item.vx;
                        item.y += item.vy;

                        if (item.x < 20) { item.x = 20; item.vx = Math.abs(item.vx); }
                        if (item.x > 80) { item.x = 80; item.vx = -Math.abs(item.vx); }

                        if (item.y < 58.0) { item.y = 58.0; item.vy = Math.abs(item.vy); }
                        if (item.y > 73.5) { item.y = 73.5; item.vy = -Math.abs(item.vy); }

                        const wave = Math.sin(floatTime * item.scaleSpeed);
                        const curScale = 1.0 + wave * 0.11;
                        const curOpacity = 0.86 + wave * 0.10;
                        const swayDeg = Math.sin(floatTime * item.swaySpeed) * 3.0 * item.swayDir;

                        item.el.style.left = `${item.x.toFixed(2)}%`;
                        item.el.style.top = `${item.y.toFixed(2)}%`;
                        item.el.style.opacity = `${curOpacity.toFixed(2)}`;
                        item.el.style.transform = `translate(-50%, -50%) scale(${curScale.toFixed(3)}) rotate(${swayDeg.toFixed(2)}deg)`;
                    }
                });

                floatingAnimId = requestAnimationFrame(animateWords);
            }

            floatingAnimId = requestAnimationFrame(animateWords);
        }

        function stopFloatingWords() {
            if (!isFloatingWordsActive) return;
            isFloatingWordsActive = false;
            if (floatingWordsLayer) {
                floatingWordsLayer.style.opacity = '0';
                setTimeout(() => {
                    if (floatingAnimId) cancelAnimationFrame(floatingAnimId);
                }, 650);
            }
        }

        let tapCount = 0;
        let tapResetTimer = null;
        let lastGateTapTime = 0;

        function handleGateFiveTap(e) {
            if (isLoginTransitioning) return;
            if (e && e.target && (e.target.closest('#admin-secret-zone') || e.target.closest('#code-auth-box'))) {
                return;
            }
            const now = Date.now();
            if (e && e.type === 'click' && (now - lastGateTapTime < 250)) {
                return;
            }
            lastGateTapTime = now;

            tapCount++;
            if (tapCount >= 5) {
                stopFloatingWords();
                codeAuthBox.style.opacity = '1';
                codeAuthBox.style.pointerEvents = 'auto';
                setTimeout(() => {
                    const codeInput = document.getElementById('input-mokjang-code');
                    if (codeInput) codeInput.focus();
                }, 100);
            }

            clearTimeout(tapResetTimer);
            tapResetTimer = setTimeout(() => {
                tapCount = 0;
            }, 1800);
        }

        authGate.addEventListener('pointerdown', handleGateFiveTap);
        authGate.addEventListener('click', handleGateFiveTap);

        // [작업 1: 코드 창이 Pass되기 전에는 이름 창 접근을 원천 차단하고 코드 창으로 포커스 유도]
        window.handleAuthBoxClick = function(e) {
            e.stopPropagation();
            if (!isCodePassed) {
                const codeInput = document.getElementById('input-mokjang-code');
                if (codeInput && document.activeElement !== codeInput) {
                    codeInput.focus();
                }
            }
        };

        window.guardNameInputFocus = function(nameInput) {
            if (!isCodePassed) {
                nameInput.blur();
                const codeInput = document.getElementById('input-mokjang-code');
                if (codeInput) codeInput.focus();
            }
        };

        function setNameInputLocked(locked) {
            const nameInput = document.getElementById('input-member-name');
            if (!nameInput) return;
            if (locked) {
                isCodePassed = false;
                nameInput.value = '';
                nameInput.disabled = true;
                nameInput.readOnly = true;
                nameInput.setAttribute('tabindex', '-1');
            } else {
                isCodePassed = true;
                nameInput.disabled = false;
                nameInput.readOnly = false;
                nameInput.removeAttribute('tabindex');
            }
        }

        window.handleCodeInput = function(input) {
            let clean = input.value.replace(/[^0-9]/g, '').slice(0, 4);
            if (input.value !== clean) input.value = clean;
            
            let validCode = window.liveFamilyConfig?.mokjangCode || '1111';
            try {
                const rawCfg = localStorage.getItem('family_config_backup');
                if (rawCfg && !window.liveFamilyConfigLoaded) {
                    const cfg = JSON.parse(rawCfg);
                    if (cfg.mokjangCode) validCode = String(cfg.mokjangCode).trim();
                }
            } catch(e) {}

            const isCodeCorrect = (clean.length === 4 && (clean === '1111' || clean === validCode));

            if (isCodeCorrect) {
                setNameInputLocked(false);
                if (document.activeElement === input) {
                    if (navigator.vibrate) {
                        try { navigator.vibrate(40); } catch(e) {}
                    }
                    const nameInput = document.getElementById('input-member-name');
                    if (nameInput) nameInput.focus();
                }
            } else {
                // 코드가 아직 4자리가 아니거나 일치하지 않으면 이름 입력창을 잠금 상태로 유지
                setNameInputLocked(true);
            }
            checkAutoLogin();
        };

        window.handleNameInput = function(input) {
            if (!isCodePassed) {
                setNameInputLocked(true);
                const codeInput = document.getElementById('input-mokjang-code');
                if (codeInput) codeInput.focus();
                return;
            }
            let clean = input.value.replace(/[^ㄱ-ㅎㅏ-ㅣ가-힣0-9]/g, '').slice(0, 4);
            if (input.value !== clean) input.value = clean;
            checkAutoLogin();
        };

        function checkAutoLogin() {
            if (!isCodePassed || isLoginTransitioning) return;
            const codeInput = document.getElementById('input-mokjang-code');
            const nameInput = document.getElementById('input-member-name');
            const code = codeInput.value.trim();
            const name = nameInput.value.trim();

            let cfg = window.liveFamilyConfig || {};
            try {
                const rawCfg = localStorage.getItem('family_config_backup');
                if (rawCfg && !window.liveFamilyConfigLoaded) {
                    cfg = JSON.parse(rawCfg) || {};
                }
            } catch(e) {}

            const validCode = cfg.mokjangCode ? String(cfg.mokjangCode).trim() : '1111';
            const familyShort = cfg.mokjangName ? String(cfg.mokjangName).trim().replace(/^우리\s*가족\s*이야기\s*/, '') : '';
            const leaderName = cfg.leaderName ? String(cfg.leaderName).trim() : '아빠';
            const subLeaderName = (cfg.subLeaderName || cfg.subleaderName) ? String(cfg.subLeaderName || cfg.subleaderName).trim() : '';
            const subLeaders = Array.isArray(cfg.subLeaders) ? cfg.subLeaders : [];
            const validMembers = Array.isArray(cfg.members) ? cfg.members.map(m => typeof m === 'object' ? m.name : m) : ['1111'];
            const memberRoles = (cfg.memberRoles && typeof cfg.memberRoles === 'object') ? cfg.memberRoles : {};

            const isDefaultMatch = (code === '1111' && name === '1111');
            const isLeaderMatch = (code === validCode && (name === leaderName || memberRoles[name] === 'leader'));
            const isSubLeaderMatch = (code === validCode && ((subLeaderName && name === subLeaderName) || subLeaders.includes(name) || memberRoles[name] === 'subleader'));
            const isMemberMatch = (code === validCode && validMembers.includes(name));

            if (code.length === 4 && name.length >= 2 && (isDefaultMatch || isLeaderMatch || isSubLeaderMatch || isMemberMatch)) {
                let userRole = 'member';
                let isAdminBool = false;

                if (isLeaderMatch || name === leaderName || name === '아빠' || name === '관리자') {
                    userRole = 'leader';
                    isAdminBool = true;
                } else if (isSubLeaderMatch || name === '엄마') {
                    userRole = 'subleader';
                    isAdminBool = true;
                }

                const isAdminFlag = isAdminBool ? '1' : '0';

                try {
                    localStorage.setItem('family_user_name', name);
                    localStorage.setItem('family_user_role', userRole);
                    localStorage.setItem('family_short_name', familyShort);
                    localStorage.setItem('family_name', familyShort ? `우리 가족 이야기 ${familyShort}` : '우리 가족 이야기');
                    localStorage.setItem('family_is_admin', isAdminBool ? 'true' : 'false');
                } catch(e) {}

                codeInput.blur();
                nameInput.blur();
                handleMemberLogin(name, familyShort, isAdminFlag, userRole);
            }
        }

        // [작업 2: 게이트가 올라가며 바로 뒤따라 index2가 올라오는 무리프레시(Zero-Refresh) 일체형 모션]
        function handleMemberLogin(userName, familyShort = '', isAdminFlag = '0', userRole = 'member') {
            if (isLoginTransitioning) return;
            isLoginTransitioning = true;

            const finalName = userName || document.getElementById('input-member-name').value.trim() || '우리가족';
            const finalFamily = familyShort || '';

            const issuePassToken = () => {
                try {
                    sessionStorage.setItem('family_entry_pass', JSON.stringify({
                        target: 'index2.html',
                        authorizedFromIndex: true,
                        token: 'tk_' + Date.now() + '_' + Math.random().toString(36).slice(2),
                        userName: finalName,
                        mokjangShort: finalFamily,
                        role: userRole,
                        isAdmin: isAdminFlag === '1',
                        issuedAt: Date.now()
                    }));
                    sessionStorage.removeItem('family_authorized_session');
                } catch (e) {}
            };

            // 1. 즉시 통행증을 발급하고 백그라운드 스테이지(iframe)에 index2.html을 미리 렌더링 시작
            issuePassToken();

            let animationStarted = false;
            const startSeamlessClimb = () => {
                if (animationStarted) return;
                animationStarted = true;

                // 게이트는 위로 올라가고, 그 바로 아래에 붙은 index2 스테이지는 함께 따라 올라옴
                authGate.classList.add('gate-open-active');
                if (seamlessStage) seamlessStage.classList.add('stage-follow-active');
                createHearts();

                // 3.0초 동반 상승 모션이 끝난 뒤 페이지 리프레시 없이 게이트만 제거하여 끊김 0% 완성
                setTimeout(() => {
                    try {
                        // 혹시라도 iframe 로드가 차단된 특수 환경일 경우에만 폴백 이동
                        const frameDoc = seamlessFrame && (seamlessFrame.contentDocument || seamlessFrame.contentWindow?.document);
                        if (!frameDoc || !frameDoc.body || frameDoc.body.children.length === 0) {
                            issuePassToken();
                            window.location.replace('index2.html');
                            return;
                        }
                    } catch (err) {}

                    authGate.style.display = 'none';
                    if (seamlessFrame && seamlessFrame.contentWindow) {
                        try { seamlessFrame.contentWindow.focus(); } catch (e) {}
                    }
                }, 3000);
            };

            if (seamlessFrame) {
                seamlessFrame.onload = () => {
                    startSeamlessClimb();
                };
                seamlessFrame.src = 'index2.html';
                // 네트워크 지연 시에도 120ms 내에 즉시 부드러운 동반 상승 시작
                setTimeout(startSeamlessClimb, 120);
            } else {
                startSeamlessClimb();
            }
        }

        let adminTapCount = 0;
        let adminTapResetTimer = null;

        function goToAdminPage(e) {
            if (e) e.stopPropagation();
            adminTapCount++;
            if (adminTapCount >= 10) {
                adminTapCount = 0;
                clearTimeout(adminTapResetTimer);
                try {
                    sessionStorage.setItem('family_entry_pass', JSON.stringify({
                        target: 'index1.html',
                        authorizedFromIndex: true,
                        token: 'tk_' + Date.now() + '_' + Math.random().toString(36).slice(2),
                        issuedAt: Date.now()
                    }));
                    sessionStorage.removeItem('family_authorized_session');
                } catch (e) {}
                try {
                    if (window.location && typeof window.location.replace === 'function') {
                        window.location.replace('index1.html');
                    } else {
                        window.location.href = 'index1.html';
                    }
                } catch(navErr) {
                    window.location.href = 'index1.html';
                }
                return;
            }
            clearTimeout(adminTapResetTimer);
            adminTapResetTimer = setTimeout(() => {
                adminTapCount = 0;
            }, 1500);
        }

        function createHearts() {
            const heartCount = 35;
            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('i');
                heart.className = 'fa-solid fa-heart floating-heart';
                
                const left = Math.random() * 100;
                const size = Math.random() * 16 + 12;
                const duration = Math.random() * 1.2 + 2.8;
                const delay = Math.random() * 0.8;
                
                heart.style.left = `${left}vw`;
                heart.style.fontSize = `${size}px`;
                heart.style.animation = `floatHeart ${duration}s ease-out ${delay}s forwards`;
                
                document.body.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, (duration + delay) * 1000 + 100);
            }
        }

        initFloatingWords();
    </script>
